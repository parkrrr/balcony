name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -input=false
      - run: tofu validate

  # Plans the PR against live state and comments what would be added, changed or destroyed.
  plan:
    # Fork and Dependabot PRs get no secrets or OIDC token, so they can't reach Azure.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [infra]
    runs-on: ubuntu-latest
    # The landing zone only trusts this environment's OIDC subject. deployment: false keeps
    # plans out of the environment's deployment history.
    environment:
      name: azure
      deployment: false
    concurrency:
      group: plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_USE_MSI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false

      - name: tofu init
        run: |
          tofu init -input=false \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"

      # A PR's image is never built, so plan against the image that's live now. Otherwise every
      # plan would show the container app changing just because the commit SHA did.
      - name: Use the deployed image tag
        run: |
          image=$(tofu state pull | jq -r '.resources[] | select(.type == "azurerm_container_app" and .name == "main") | .instances[0].attributes.template[0].container[0].image')
          tag=${image##*:}
          echo "TF_VAR_image_tag=${tag:-$GITHUB_SHA}" >> "$GITHUB_ENV"

      # Plans only read state, so skip the lock rather than queue behind (or block) a deploy.
      - name: tofu plan
        run: tofu plan -input=false -no-color -lock=false -out=tfplan

      # One comment per PR, updated in place on each push.
      - name: Comment plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- tofu-plan -->'
          body=$(tofu show -json tfplan | jq -r --arg marker "$marker" --arg run "$RUN_URL" --arg sha "${HEAD_SHA::7}" '
            [.resource_changes[]? | {address, actions: (.change.actions | sort)}] as $all
            | def pick($a): [$all[] | select(.actions == ($a | sort)) | .address];
              def section($title; $list):
                if ($list | length) > 0 then "\n**\($title)**\n" + ($list | map("- `\(.)`") | join("\n")) + "\n" else empty end;
            pick(["create"]) as $add | pick(["update"]) as $change
            | pick(["delete"]) as $destroy | pick(["create", "delete"]) as $replace
            | $marker,
              "### OpenTofu plan",
              if ($add + $change + $destroy + $replace | length) == 0 then "\nNo changes." else
                "\n\($add + $replace | length) to add, \($change | length) to change, \($destroy + $replace | length) to destroy.",
                section("Added"; $add),
                section("Changed"; $change),
                section("Replaced"; $replace),
                section("Destroyed"; $destroy)
              end,
              "\n<sub>Commit \($sha), planned with the deployed image. [Full plan](\($run))</sub>"
          ')
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, infra]
    runs-on: ubuntu-latest
    # The landing zone trusts this environment's OIDC subject
    # (repo:parkrrr@393737/balcony@1194175094:environment:azure).
    environment: azure
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_USE_MSI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_image_tag: ${{ github.sha }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      # Also a fast credential preflight: a bad federated credential otherwise
      # surfaces as a 300s backend timeout in tofu init.
      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false

      - name: tofu init
        run: |
          tofu init -input=false \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=${ARM_CLIENT_ID}" \
            -backend-config="tenant_id=${ARM_TENANT_ID}" \
            -backend-config="subscription_id=${ARM_SUBSCRIPTION_ID}"

      # The app's image lives in a registry this config creates, so the very
      # first run creates the registry alone before there is anything to push to.
      - name: Bootstrap registry
        run: |
          if ! tofu state list | grep -qx 'azurerm_container_registry.main'; then
            tofu apply -input=false -no-color -auto-approve -target=azurerm_container_registry.main
          fi

      - name: Build and push image
        run: |
          registry=$(tofu output -raw registry_login_server)
          az acr login --name "$(tofu output -raw registry_name)"
          docker build -t "$registry/balcony:$TF_VAR_image_tag" ..
          docker push "$registry/balcony:$TF_VAR_image_tag"

      - name: tofu plan
        run: tofu plan -input=false -no-color -out=tfplan

      - name: tofu apply
        run: tofu apply -input=false -no-color -auto-approve tfplan

      # Every deploy pushes an image tagged with its commit, so without this the registry only
      # grows. Runs after a successful apply, so the image just deployed is the newest and is
      # always kept; the four before it stay around for rollback. Tags are commit SHAs and are
      # never reused, so deleting by tag leaves no untagged manifests behind. A failed purge
      # only warns: the deploy itself has already succeeded.
      - name: Purge old images
        continue-on-error: true
        run: |
          registry=$(tofu output -raw registry_name)
          az acr repository show-tags --name "$registry" --repository balcony --orderby time_desc --output tsv \
            | tail -n +6 \
            | while read -r tag; do
                echo "Deleting balcony:$tag"
                az acr repository delete --name "$registry" --image "balcony:$tag" --yes --output none
              done

      - name: Step summary
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "$(tofu output -raw url)"
          } >> "$GITHUB_STEP_SUMMARY"
